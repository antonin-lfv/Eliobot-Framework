# Eliobot - Mosquitto MQTT Broker Config
# Compatible Mosquitto 2.x (requires explicit listener + allow_anonymous)

# Listener TCP sur toutes les interfaces (indispensable pour recevoir le robot en WiFi)
listener 1883 0.0.0.0
allow_anonymous true

# Listener WebSocket (optionnel, utile pour debug navigateur)
listener 9001
protocol websockets
allow_anonymous true

# Persistence (conserve le dernier retain au redémarrage)
persistence true
persistence_location /mosquitto/data/

# Logs vers stdout (visible via docker compose logs)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
