[project]
name = "eliobot-fastapi-dashboard"
version = "0.1.0"
description = "Eliobot Dashboard - FastAPI + WebSocket + MQTT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "paho-mqtt>=2.1.0",
    "aiofiles>=23.0.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "httpx>=0.28,<1",
    "mcp>=1.30,<2",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "docker>=7,<8"]
