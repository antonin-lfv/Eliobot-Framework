services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: eliobot-mqtt
    ports:
      - "1883:1883"   # MQTT TCP (robot + dashboard)
      - "9001:9001"   # MQTT WebSocket (debug navigateur)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - elio-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build: ./fastapi-dashboard
    container_name: eliobot-dashboard
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - TZ=Europe/Paris
    volumes:
      # Hot-reload en développement : monter le code source
      - ./fastapi-dashboard/app.py:/app/app.py:ro
      - ./fastapi-dashboard/static:/app/static:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    networks:
      - elio-net
    restart: unless-stopped

networks:
  elio-net:
    driver: bridge

volumes:
  mosquitto_data:
